[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nielsos-research"
version = "0.1.0"
description = "TradingView-orchestrated research platform for NielsOS"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "playwright>=1.46",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "PyYAML>=6.0",
  "structlog>=24.2",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
nrl = "nielsos_research.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
